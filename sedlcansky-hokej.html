<style>
#sedlcansky-microsite{--ms-red:#b60925;--ms-cream:#f5e4c8;--ms-ink:#681321;width:100%;height:100svh;min-height:400px;margin:auto;position:relative;isolation:isolate;container-type:inline-size;background:radial-gradient(ellipse at 45% 30%,#c8142c 0,#b60824 58%,#9b041d 100%);color:var(--ms-cream);font-family:Arial,Helvetica,sans-serif;color-scheme:light;box-sizing:border-box;overflow:hidden}
#sedlcansky-microsite{font-size:16px;line-height:1.2}
#sedlcansky-microsite *{box-sizing:border-box}
#sedlcansky-microsite [hidden]{display:none!important}
#sedlcansky-microsite .ms-page{height:100%;max-width:1600px;margin:auto;padding:15px 38px 22px;display:grid;grid-template-rows:68px minmax(0,1fr)}
#sedlcansky-microsite .ms-header{display:flex;align-items:center;justify-content:space-between;gap:18px;position:relative;z-index:6}
#sedlcansky-microsite .ms-brand{width:140px;height:76px;object-fit:contain;display:block;filter:brightness(0) saturate(100%) invert(91%) sepia(17%) saturate(440%) hue-rotate(343deg) brightness(104%) contrast(93%)}
#sedlcansky-microsite .ms-sound{font:500 12px Arial,Helvetica,sans-serif;color:var(--ms-cream);background:transparent;border:0;min-height:44px;padding:8px 0;text-decoration:underline;text-underline-offset:4px}
#sedlcansky-microsite button:focus-visible{outline:3px solid #ffe5a1;outline-offset:4px}
#sedlcansky-microsite .ms-story{display:grid;grid-template-columns:minmax(190px,.8fr) minmax(0,2.35fr) minmax(150px,.63fr);align-items:center;gap:22px;position:relative;min-height:0;height:100%}
#sedlcansky-microsite .ms-source-pane{position:relative;z-index:1;min-width:0;align-self:center}
#sedlcansky-microsite h1{font:700 clamp(36px,4.7cqw,66px)/1 Georgia,'Times New Roman',serif;letter-spacing:-1.9px;color:var(--ms-cream);margin:0 0 14px;white-space:nowrap}
#sedlcansky-microsite .ms-subtitle{font:400 clamp(18px,2.1cqw,27px)/1.22 Georgia,'Times New Roman',serif;color:var(--ms-cream);margin:0;max-width:260px;text-wrap:balance}
#sedlcansky-microsite .ms-prize-space{height:clamp(26px,6svh,65px)}
#sedlcansky-microsite .ms-source{display:block;width:100%;max-width:280px;height:auto;aspect-ratio:240/210;margin-left:-8px}
#sedlcansky-microsite .ms-game{min-width:0;min-height:0;position:relative;width:100%;height:100%;display:grid;place-items:center}
#sedlcansky-microsite .ms-arena{position:relative;touch-action:manipulation;max-width:100%;max-height:100%}
#sedlcansky-microsite .ms-rink{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}
#sedlcansky-microsite .ms-game-hit{display:block;position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:transparent;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#sedlcansky-microsite .ms-game-hit:focus-visible{outline-offset:-5px}
#sedlcansky-microsite .ms-overlay{position:absolute;inset:0;pointer-events:none}
#sedlcansky-microsite .ms-tap{position:absolute;left:10px;right:10px;top:58%;text-align:center;font-size:13px;font-weight:700;color:var(--ms-red);text-shadow:0 1px 9px #fff8e7,0 0 10px #fff8e7}
#sedlcansky-microsite .ms-result{position:absolute;top:30%;left:15px;right:15px;text-align:center;color:var(--ms-red);display:flex;flex-direction:column;align-items:center;gap:10px;text-shadow:0 1px 12px #fff8e8,0 0 20px #fff8e8}
#sedlcansky-microsite .ms-result span{font-size:12px;font-weight:700}
#sedlcansky-microsite .ms-result strong{font:700 62px/1 Georgia,serif;font-variant-numeric:tabular-nums}
#sedlcansky-microsite.is-over .ms-tap{top:57%;font-size:12px}
#sedlcansky-microsite .ms-scoreboard{background:linear-gradient(125deg,#ffedcf,#efcf9e);border-radius:10px;border:2px solid #fff0d2;box-shadow:2px 7px 20px #65051470;position:relative;padding:15px 13px 12px;color:var(--ms-ink);min-width:0;width:100%;max-width:210px;justify-self:end;text-align:left}
#sedlcansky-microsite .ms-board-brand{display:none}
#sedlcansky-microsite .ms-board-main>span,#sedlcansky-microsite .ms-board-record>span{font:700 clamp(15px,1.7cqw,23px)/1.1 Georgia,serif;display:block}
#sedlcansky-microsite .ms-led{display:block;width:100%;height:77px;margin:9px auto 13px;padding:7px;border-radius:6px;background:linear-gradient(#4d0610,#630c17);overflow:visible}
#sedlcansky-microsite .ms-led-score .led-on,#sedlcansky-microsite .ms-led-best .led-on{fill:#ff654d;filter:drop-shadow(0 0 2px #ff402080)}
#sedlcansky-microsite .led-off{fill:#69231f}
#sedlcansky-microsite .ms-board-record{border-top:1px solid #a7524260;padding-top:12px}
#sedlcansky-microsite .ms-led-best{height:60px;margin:8px auto 13px}
#sedlcansky-microsite .ms-impact-line{display:flex;justify-content:space-between;align-items:center;gap:5px;border-top:1px solid #a7524260;padding-top:12px;font-size:11px;font-weight:700;color:var(--ms-ink)}
#sedlcansky-microsite .ms-impact-line b{font:400 15px 'Courier New',monospace;white-space:nowrap}
#sedlcansky-microsite .ms-flight{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#sedlcansky-microsite .ms-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#sedlcansky-microsite .ms-header-actions{display:flex;align-items:center;gap:24px}
#sedlcansky-microsite .ms-table-link{border:1px solid #f5e4c870;border-radius:5px;background:transparent;color:var(--ms-cream);padding:9px 12px;min-height:40px;font:700 12px Arial,sans-serif}
#sedlcansky-microsite .ms-table-link:hover{background:#f5e4c817}
#sedlcansky-microsite .ms-button{border:1px solid var(--ms-red);border-radius:6px;padding:11px 15px;min-height:44px;background:var(--ms-red);color:var(--ms-cream);font:700 13px Arial,sans-serif;text-shadow:none}
#sedlcansky-microsite .ms-button-outline{background:transparent;color:var(--ms-red)}
#sedlcansky-microsite .ms-text-button{border:0;background:transparent;color:var(--ms-red);padding:10px 0;min-height:44px;text-decoration:underline;text-underline-offset:3px;font:700 12px Arial,sans-serif;text-shadow:none}
#sedlcansky-microsite .ms-result button{pointer-events:auto}
#sedlcansky-microsite .ms-result{top:27%;gap:5px}
#sedlcansky-microsite .ms-competition{width:min(460px,calc(100vw - 28px));max-height:calc(100svh - 28px);margin:auto;padding:0;border:2px solid #fff2d9;border-radius:14px;background:var(--ms-cream);color:var(--ms-ink);box-shadow:0 20px 80px #42041370;overflow:auto;overscroll-behavior:contain;font:14px/1.4 Arial,Helvetica,sans-serif}
#sedlcansky-microsite .ms-competition::backdrop{background:#3e031ac2;backdrop-filter:blur(4px)}
#sedlcansky-microsite .ms-competition-inner{padding:28px;position:relative}
#sedlcansky-microsite .ms-dialog-close{position:absolute;right:9px;top:7px;width:44px;height:44px;padding:0;background:transparent;border:0;color:var(--ms-ink);font:28px/1 Arial,sans-serif}
#sedlcansky-microsite .ms-eyebrow{margin:0 40px 6px 0;font-size:10px;letter-spacing:1.6px;text-transform:uppercase}
#sedlcansky-microsite .ms-competition h2{font:700 31px/1.1 Georgia,serif;margin:0 30px 22px 0;color:var(--ms-red);letter-spacing:-.5px}
#sedlcansky-microsite .ms-earned{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 21px;padding:14px 17px;border-radius:7px;background:#650b1b;color:var(--ms-cream);font-weight:700}
#sedlcansky-microsite .ms-earned strong{font:700 43px/1 'Courier New',monospace;color:#ff8164;letter-spacing:2px}
#sedlcansky-microsite .ms-finish label{display:block;margin-bottom:7px;font-weight:700;font-size:12px}
#sedlcansky-microsite .ms-name-row{display:flex;gap:8px}
#sedlcansky-microsite .ms-name-row input{min-width:0;flex:1;width:100%;min-height:45px;border:1px solid #a76b5e;border-radius:6px;padding:11px 10px;background:#fff9ee;color:var(--ms-ink);font:16px Arial,sans-serif}

  if(d.mode==='triangle'){const a=clock*omega-PI/2+d.slot*TAU/3;d.x=cx+Math.cos(a)*radius;d.y=cy+Math.sin(a)*radius;d.vx=Math.cos(clock*.48)*24*.48-Math.sin(a)*radius*omega;d.vy=Math.cos(clock*.61+.7)*14*.61+Math.cos(a)*radius*omega;d.rotation=d.tilt+Math.sin(a)*.1;}
  else{
   const t=clock*d.speed+d.phase;
   if(d.mode==='vertical'){d.x=d.baseX;d.vx=0;d.y=d.baseY+Math.sin(t)*d.amp;d.vy=Math.cos(t)*d.amp*d.speed;}
   else if(d.mode==='ellipse'){d.x=d.baseX+Math.cos(t)*d.amp;d.y=d.baseY+Math.sin(t)*d.ampY;d.vx=-Math.sin(t)*d.amp*d.speed;d.vy=Math.cos(t)*d.ampY*d.speed;}
   else{d.x=d.baseX+Math.sin(t)*d.amp;d.vx=Math.cos(t)*d.amp*d.speed;d.y=d.baseY;d.vy=0;}
   d.rotation=d.tilt+Math.sin(t*.7)*.09;

  if(puck.x<25+puck.r&&puck.y>=68&&puck.y<=453){puck.x=25+puck.r;if(bounce(1,0)){wallHits++;registerImpact('left',25,puck.y);}}

   if((puck.x-c.x)*c.sx>0&&(puck.y-c.y)*c.sy>0){const dx=puck.x-c.x,dy=puck.y-c.y,dist=Math.hypot(dx,dy),limit=42-puck.r;if(dist>limit&&dist>0){puck.x=c.x+dx/dist*limit;puck.y=c.y+dy/dist*limit;if(bounce(-dx/dist,-dy/dist)){wallHits++;registerImpact(c.id,c.x+dx/dist*42,c.y+dy/dist*42);}}}if(state!=='shot')break;
  }

   const d=defenders[i],half=(d.w-d.h)/2,nearest=clamp(puck.x,d.x-half,d.x+half),dx=puck.x-nearest,dy=puck.y-d.y,dist=Math.hypot(dx,dy),limit=puck.r+d.h/2;
   if(dist>limit+3)d.locked=false;if(dist<limit&&dist>.0001){const nx=dx/dist,ny=dy/dist;puck.x=nearest+nx*(limit+.05);puck.y=d.y+ny*(limit+.05);if(bounce(nx,ny,d.vx,d.vy)&&!d.locked)veggieContact(d,i,nearest+nx*d.h/2,d.y+ny*d.h/2);}if(state!=='shot')break;

}

function stands(){
 const key=stageW+':8';
 if(crowdCacheKey!==key){const prior=ctx;stadiumCache.width=crowdCache.width=stageW*2;stadiumCache.height=crowdCache.height=1200;ctx=stadiumCache.getContext('2d');ctx.setTransform(2,0,0,2,0,0);stadiumBase();ctx=crowdCache.getContext('2d');ctx.setTransform(2,0,0,2,0,0);ctx.drawImage(stadiumCache,0,0,stageW,600);drawFans(false);ctx=prior;crowdCacheKey=key;}
 ctx.drawImage(cheerTime>0?stadiumCache:crowdCache,0,0,stageW,600);if(cheerTime>0)drawFans(true);
}

function resize(){
 stageW=root.clientWidth<=700?520:600;const box=ui.arena.parentElement,aw=box.clientWidth||600,ah=box.clientHeight||600,width=Math.max(1,Math.min(aw,ah*stageW/600));ui.arena.style.width=width+'px';ui.arena.style.height=width*600/stageW+'px';
 if(canvas.width!==stageW*2)canvas.width=stageW*2;if(canvas.height!==1200)canvas.height=1200;measureStory();render();
}

function setLED(node,value){
 const text=String(Math.max(0,Math.floor(value))).padStart(2,'0');if(node.dataset.value===text)return;node.dataset.value=text;node.setAttribute('viewBox',`0 0 ${text.length*36} 64`);node.setAttribute('aria-label',String(value));
 const paths={a:'M7 3H29L25 7H11Z',b:'M30 5V27L26 30V10Z',c:'M30 34V56L26 52V38Z',d:'M7 59H29L25 55H11Z',e:'M4 34L8 38V52L4 56Z',f:'M4 5L8 10V26L4 30Z',g:'M9 29H25L29 33L25 36H9L5 33Z'},segments=['abcdef','bc','abdeg','abcdg','bcfg','acdfg','acdefg','abc','abcdefg','abcdfg'];
 node.innerHTML=[...text].map((digit,i)=>`<g transform="translate(${i*36} 0)">${Object.entries(paths).map(([name,d])=>`<path class="${segments[Number(digit)].includes(name)?'led-on':'led-off'}" d="${d}"/>`).join('')}</g>`).join('');
}

function registerImpact(kind,x,y,isGoal=false){
 if(state!=='shot')return false;
 if(!isGoal&&lastContact&&shotAge-lastContact.time<.035&&Math.hypot(x-lastContact.x,y-lastContact.y)<8)return false;
 impactCount++;lastContact={kind,x,y,time:shotAge};impactMarks.push({x:clamp(x,36,364),y:clamp(y,46,477),n:impactCount});ui.impact.textContent=`${impactCount} / ${MAX_IMPACTS}`;
 if(!isGoal){if(!muted&&stadiumSound)stadiumSound.impact(kind,impactCount);if(impactCount>=MAX_IMPACTS)miss();}return true;
}

function buildCrowd(){
 crowd=[];for(let row=0;row<8;row++){const d=12+row*8,r=61+d;
  for(let j=0,y=70;y<448;y+=8,j++){crowd.push({x:1-d,y,row,side:'left',j,rotation:PI/2});crowd.push({x:399+d,y,row,side:'right',j,rotation:-PI/2});}
  for(let j=0,x=68;x<336;x+=8,j++){crowd.push({x,y:3-d,row,side:'top',j,rotation:PI});crowd.push({x,y:514+d,row,side:'bottom',j,rotation:0});}
  for(const c of [{x:62,y:64,a:PI},{x:338,y:64,a:PI*1.5},{x:338,y:453,a:0},{x:62,y:453,a:PI/2}]){const count=Math.ceil(r*PI/2/8);for(let j=0;j<count;j++){const a=c.a+(j+.5)/count*PI/2;crowd.push({x:c.x+Math.cos(a)*r,y:c.y+Math.sin(a)*r,row,side:'curve',j,rotation:a-PI/2});}}
 }
}

function crowdMuralPixel(f){
 if(!choreoTime||choreoKind==='cheer')return null;
 if(choreoKind==='wave')return(f.j+f.row*2+Math.floor(reduced?0:clock*6))%15<7;
 if(f.side==='left'||f.side==='right'){
  const word=choreoKind==='brand'?(f.side==='left'?'SEDLČANSKÝ':'HERMELÍN'):'GÓL',len=word.length*4-1,along=f.side==='left'?47-f.j:f.j,col=along-Math.floor((48-len)/2),row=f.side==='left'?f.row:5-f.row;
  return col>=0&&col<len&&wordPixel(word,col,row);
 }
 if(f.side==='top'||f.side==='bottom')return wordPixel('GÓL',f.j-11,f.side==='top'?5-f.row:f.row);
 return(f.j+f.row)%5<2;
}

function drawImpacts(){
 const size=(canvas.clientWidth||600)<400?25:22;
 for(const m of impactMarks){ctx.save();ctx.fillStyle='#fff8e5e8';circle(m.x,m.y,12.7,'#fff8e5e8');label(String(m.n),m.x,m.y+7.5,size,'#be6535','bold');ctx.restore();}
}

function renderSource(){
 const before=ctx;ctx=sourceCtx;try{ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,240,210);const onPan=hot||state==='grill';
  if(onPan){const heating=state==='grill'?clamp((elapsed-.12)/.85,0,1):1,launch=state==='hotDrop'&&elapsed<.22?Math.sin(elapsed/.22*PI):0;ctx.save();ctx.translate(0,-launch*7);pan(126,95,.83,-.13-launch*.12,state==='grill'?.6:0);if(state==='grill'||state==='goal'||(state==='hotDrop'&&elapsed<.05)){cheese(126,95,46,heating,.05);steam(126,67,clock,heating);}ctx.restore();if(state==='grill'&&!reduced)for(let i=0;i<6;i++){const p=(elapsed*.8+i/6)%1;circle(80+i*17,130-p*65,1.5*(1-p),'#fbdc8aaa');}}
  else if(pack.complete&&pack.naturalWidth){const t=state==='coldDrop'?clamp(elapsed/.3,0,1):0;ctx.save();ctx.translate(123,105);ctx.rotate(-.06+Math.sin(t*PI)*.14);ctx.shadowColor='#56031360';ctx.shadowBlur=10;ctx.shadowOffsetY=6;ctx.drawImage(pack,-67,-68,134,136);ctx.restore();}
 }finally{ctx=before;}
}

function measureStory(){
 const b=ui.story.getBoundingClientRect(),s=ui.source.getBoundingClientRect(),r=canvas.getBoundingClientRect();storyBox={width:b.width||900,height:b.height||600,sourceX:s.left-b.left+s.width*(hot||state==='grill'?126:123)/240,sourceY:s.top-b.top+s.height*(hot||state==='grill'?95:105)/210,sourceWidth:s.width||180,rinkLeft:r.left-b.left,rinkTop:r.top-b.top,rinkWidth:r.width||500,rinkHeight:r.height||500};
 const fw=Math.max(2,Math.ceil(storyBox.width*2)),fh=Math.max(2,Math.ceil(storyBox.height*2));if(flightCanvas.width!==fw)flightCanvas.width=fw;if(flightCanvas.height!==fh)flightCanvas.height=fh;
}

function renderFlight(){
 const before=ctx;ctx=flightCtx;try{ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,storyBox.width,storyBox.height);if(state!=='coldDrop'&&state!=='hotDrop')return;
  const e=clamp(elapsed/.6,0,1),p=e*e*(3-2*e),mapX=storyBox.rinkWidth/stageW,mapY=storyBox.rinkHeight/stageH,tx=storyBox.rinkLeft+(stageW/2-W*rinkScale/2+spawn.x*rinkScale)*mapX,ty=storyBox.rinkTop+(80+spawn.y*rinkScale)*mapY;
  const arc=Math.sin(p*PI)*Math.min(130,storyBox.width*.15),x=storyBox.sourceX+(tx-storyBox.sourceX)*p,y=storyBox.sourceY+(ty-storyBox.sourceY)*p-arc,targetR=puck.r*rinkScale*mapX,startR=(state==='hotDrop'?46:29)*storyBox.sourceWidth/240,r=startR+(targetR-startR)*p;
  shadow(x,storyBox.sourceY+(ty-storyBox.sourceY)*p+5,r*(1-.3*Math.sin(p*PI)),.15);const rotation=reduced?0:(state==='hotDrop'?p*TAU*1.5:p*PI*.4);cheese(x,y,r,state==='hotDrop'?1:0,rotation);
  if(e>.88){ctx.save();ctx.globalAlpha=(1-e)*5;ctx.strokeStyle='#be9c6570';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(tx,ty+5,targetR*(1+(e-.88)*15),targetR*.35*(1+(e-.88)*15),0,0,TAU);ctx.stroke();ctx.restore();}
 }finally{ctx=before;}
}

function difficulty(level){return{goalWidth:106,aimArc:level===1?0:level<=5?.2+(level-2)*.095:Math.min(1.06,.7+(level-6)*.065),aimSpeed:level<=5?.72+Math.max(0,level-1)*.14:Math.min(3.2,1.5+(level-6)*.14),formation:level>=6};}

function foodSprite(index,x,y,size,rotation=0,ax=.5,ay=.5){
 if(!food.complete||!food.naturalWidth)return false;const cw=food.naturalWidth/4,ch=food.naturalHeight/2;ctx.save();ctx.translate(x,y);ctx.rotate(rotation);
 if(index===6){
  // Both outlines have the same winding, so their overlap stays visible.
  ctx.beginPath();ctx.arc(0,0,size*.38,0,TAU);ctx.closePath();
  ctx.moveTo(-size*.26,size*.12);ctx.lineTo(-size*.10,size*.29);ctx.lineTo(-size*.49,size*.58);ctx.quadraticCurveTo(-size*.64,size*.54,-size*.60,size*.39);ctx.closePath();ctx.clip();
 }else if(index===7){ctx.beginPath();ctx.roundRect(-size*.23,-size*.5,size*.46,size*.53,size*.08);ctx.roundRect(-size*.11,-size*.02,size*.22,size*.53,size*.07);ctx.clip();}
 ctx.drawImage(food,(index%4)*cw,Math.floor(index/4)*ch,cw,ch,-size*ax,-size*ay,size,size);ctx.restore();return true;
}

function stadiumBase(){
 ctx.save();ctx.translate(stageW/2-W*rinkScale/2,80);ctx.scale(rinkScale,rinkScale);ctx.save();ctx.shadowColor='#57031680';ctx.shadowBlur=16;ctx.shadowOffsetY=8;rr(-78,-75,556,669,141,'#e2c39a','#f9e4c6',2);ctx.restore();
 for(let row=7;row>=0;row--){const d=12+row*8;rr(1-d-6,3-d-6,398+2*d+12,511+2*d+12,61+d+6,row%2?'#a88559':'#d4b589','#f6dfb858',1);}
 rr(-5,-2,410,524,67,'#9f1728','#f5d7a7',2);
 for(const y of [173,347]){for(const [x,w] of [[-70,63],[407,63]]){rr(x,y,w,9,0,'#eacfaa');for(let k=0;k<6;k++)line(x+k*11,y,x+k*11,y+9,'#ac895d',.7);}}
 for(const y of [-66,518]){rr(194,y,12,65,0,'#ead1ac');for(let k=0;k<6;k++)line(194,y+k*11,206,y+k*11,'#ad8d64',1);}
 ctx.restore();
}

function drawFans(animated){
 ctx.save();ctx.translate(stageW/2-W*rinkScale/2,80);ctx.scale(rinkScale,rinkScale);const mural=animated&&choreoTime>0&&cheerTime<5.55&&choreoKind!=='cheer',normal=['#c4b38d','#6f6657','#b72b31','#e4d2af','#94836c','#c69368'];
 for(let i=0;i<crowd.length;i++){const f=crowd[i],seed=i*17+f.row*31;if((f.side==='left'||f.side==='right')&&((f.y>=171&&f.y<184)||(f.y>=345&&f.y<359))&&!mural)continue;if((f.side==='top'||f.side==='bottom')&&f.x>187&&f.x<213&&!mural)continue;
  const jump=animated&&!reduced?Math.max(0,Math.sin(clock*13+seed))*(mural?.85:4.3):0,pixel=mural?choreoPixel(f):null,color=mural?(pixel?'#fff0ce':RED):animated?[RED,'#fff1d5','#c82a34','#e3be76'][seed%4]:normal[seed%6],skin=seed%3?'#d6b58a':'#aa805c';
  ctx.save();ctx.translate(f.x,f.y-jump);ctx.rotate(f.rotation+(animated&&!reduced&&!mural?Math.sin(clock*9+seed)*.1:0));
  rr(-2.7,-.3,5.4,5.9,1.5,color);circle(0,-2.3,1.9,skin);
  if(animated){const wave=reduced?0:Math.sin(clock*11+seed),leftY=-3.4-wave*1.6,rightY=-3.4+wave*1.6;line(-2,1,-4.8,leftY,color,1.5);line(2,1,4.8,rightY,color,1.5);circle(-4.8,leftY,.85,skin);circle(4.8,rightY,.85,skin);if(seed%4===0&&!mural)line(-4.8,-5.1-wave*.7,4.8,-5.1+wave*.7,seed%2?RED:'#fff0ce',1.9);}
  ctx.restore();
 }ctx.restore();
}

function wordPixel(word,col,row){
 const c=word[Math.floor(col/4)],x=col%4;if(x>2||!c)return false;const base=c.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 if(row===0)return c==='Č'?(x===0||x===2):['Ý','Í','Ó'].includes(c)?x===2:false;
 const p=PIXEL_FONT[base];return p?.[row-1]?.[x]==='1';
}

function choreoPixel(f){if(!choreoTime||choreoKind==='cheer')return null;if(f.row===0||f.row===7)return(f.j+f.row)%5===0;return crowdMuralPixel({...f,row:f.row-1});}

ui.action.addEventListener('click',action);
ui.sound.addEventListener('click',()=>{muted=!muted;if(!muted)initAudio();if(stadiumSound)stadiumSound.setMuted(muted);ui.sound.textContent=muted?'Zvuk: vyp.':'Zvuk: zap.';ui.sound.setAttribute('aria-pressed',String(!muted));if(!muted)tone(660,.1);});
document.addEventListener('visibilitychange',()=>{previous=0;if(audio&&audio.state!=='closed'){if(document.hidden)audio.suspend().catch(()=>{});else if(!muted)audio.resume().catch(()=>{});}});setLevel();buildCrowd();sync();resize();if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe(ui.story);if(window.addEventListener)window.addEventListener('resize',resize);food.onload=()=>render();raf=requestAnimationFrame(frame);
})();

</script>
